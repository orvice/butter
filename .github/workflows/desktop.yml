name: Desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'proto/**'
      - 'pkg/proto/**'
      - '.github/workflows/desktop.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'proto/**'
      - 'pkg/proto/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # desktop/go.mod requires 1.27.3; the root module still builds with 1.27.
          go-version: '1.27.3'

      - name: Vet
        run: go vet ./...

      - name: Type-check the macOS-only window code
        run: GOOS=darwin CGO_ENABLED=0 go vet ./...

      - name: Test
        run: go test ./...

      - name: Test with the race detector
        run: CGO_ENABLED=1 go test -race ./...

  build-macos:
    runs-on: macos-15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: CGO_ENABLED=1 go test -race ./...

      - name: Build the binary
        run: go build -o bin/butter-desktop ./cmd/butter-desktop
