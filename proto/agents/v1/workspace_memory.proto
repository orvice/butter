syntax = "proto3";

package agents.v1;

import "google/protobuf/timestamp.proto";

option go_package = "go.orx.me/apps/butter/pkg/proto/agents/v1;agentsv1";

// =============================================================================
// WorkspaceMemoryConfig connects a workspace to a self-hosted mem0 OSS server
// that holds its Workspace Memory and Agent Memory (ADR-0013, issue #333). A
// workspace has zero or one config. The mem0 API key is deliberately not a
// proto field: it is encrypted through the secretbox credential seam and
// `credential_set` only reports whether one is stored.
// =============================================================================

message WorkspaceMemoryConfig {
  // ID of the workspace this config belongs to. Stamped by the repository
  // from request context; never taken from client input.
  // @gotags: json:"workspace_id,omitempty" yaml:"workspace_id,omitempty" bson:"workspace_id,omitempty"
  string workspace_id = 1;

  // Base URL of the mem0 OSS REST server, e.g. "https://mem0.example.com".
  // @gotags: json:"base_url,omitempty" yaml:"base_url,omitempty" bson:"base_url,omitempty"
  string base_url = 2;

  // When false, memory-enabled agents in this workspace run without memory.
  // @gotags: json:"enabled,omitempty" yaml:"enabled,omitempty" bson:"enabled,omitempty"
  bool enabled = 3;

  // Reports whether a mem0 API key is stored. Derived from the credential
  // columns on every read; never taken from client input.
  // @gotags: json:"credential_set,omitempty" yaml:"credential_set,omitempty" bson:"credential_set,omitempty"
  bool credential_set = 4;

  // When the API key was last set or rotated. Unset when no key is stored.
  // @gotags: json:"credential_updated_at,omitempty" yaml:"credential_updated_at,omitempty" bson:"credential_updated_at,omitempty"
  google.protobuf.Timestamp credential_updated_at = 5;

  // @gotags: json:"created_at,omitempty" yaml:"created_at,omitempty" bson:"created_at,omitempty"
  google.protobuf.Timestamp created_at = 6;

  // @gotags: json:"updated_at,omitempty" yaml:"updated_at,omitempty" bson:"updated_at,omitempty"
  google.protobuf.Timestamp updated_at = 7;
}

// WorkspaceMemoryConfigService manages the workspace's mem0 connection. Any
// member may read it; owners, admins, and global admins may change it.
service WorkspaceMemoryConfigService {
  // GetWorkspaceMemoryConfig returns the config, or an unset `config` when
  // the workspace has none.
  rpc GetWorkspaceMemoryConfig(GetWorkspaceMemoryConfigRequest) returns (GetWorkspaceMemoryConfigResponse);

  // PutWorkspaceMemoryConfig creates or replaces the config. When the result
  // is enabled, the server is probed first: a rejected API key refuses the
  // save, while an unreachable server saves and reports a warning.
  rpc PutWorkspaceMemoryConfig(PutWorkspaceMemoryConfigRequest) returns (PutWorkspaceMemoryConfigResponse);

  // DeleteWorkspaceMemoryConfig removes the config and its API key. Agents
  // that enable memory keep running, without memory.
  rpc DeleteWorkspaceMemoryConfig(DeleteWorkspaceMemoryConfigRequest) returns (DeleteWorkspaceMemoryConfigResponse);

  // TestWorkspaceMemoryConnection probes the stored config's server with the
  // stored API key and reports the outcome.
  rpc TestWorkspaceMemoryConnection(TestWorkspaceMemoryConnectionRequest) returns (TestWorkspaceMemoryConnectionResponse);
}

message GetWorkspaceMemoryConfigRequest {}

message GetWorkspaceMemoryConfigResponse {
  // Unset when the workspace has no config.
  WorkspaceMemoryConfig config = 1;
}

message PutWorkspaceMemoryConfigRequest {
  string base_url = 1;
  bool enabled = 2;
  // Write-only mem0 API key. Absent keeps the stored key, empty clears it,
  // any other value sets or rotates it.
  optional string api_key = 3;
}

message PutWorkspaceMemoryConfigResponse {
  WorkspaceMemoryConfig config = 1;
  // Non-empty when the config was saved but the probe could not reach the
  // server.
  string warning = 2;
}

message DeleteWorkspaceMemoryConfigRequest {}

message DeleteWorkspaceMemoryConfigResponse {}

message TestWorkspaceMemoryConnectionRequest {}

message TestWorkspaceMemoryConnectionResponse {
  // True when the server answered the probe and accepted the API key.
  bool ok = 1;
  // Human-readable probe failure, empty when ok.
  string error = 2;
}

// =============================================================================
// WorkspaceMemoryService lets people see and prune what the workspace's mem0
// server holds (issue #339): list, semantic search, and delete one memory.
// Any member may list and search; deleting requires the workspace owner or
// admin role (global admins bypass). mem0 OSS v3 extraction is ADD-only, so
// automatic capture accumulates near-duplicates that people remove here.
// =============================================================================

enum WorkspaceMemoryScope {
  // Treated as WORKSPACE.
  WORKSPACE_MEMORY_SCOPE_UNSPECIFIED = 0;
  // Workspace Memory: the pool shared across the workspace.
  WORKSPACE_MEMORY_SCOPE_WORKSPACE = 1;
  // Agent Memory: private to one agent; requests name it with agent_id.
  WORKSPACE_MEMORY_SCOPE_AGENT = 2;
}

message WorkspaceMemory {
  // mem0 memory ID.
  string id = 1;

  // The stored memory text.
  string memory = 2;

  // Which scope holds the memory.
  WorkspaceMemoryScope scope = 3;

  // For Agent Memory, the owning Agent ID. For Workspace Memory, the Agent
  // whose turn produced it, when known (provenance).
  string agent_id = 4;

  // Entry point the memory came from (provenance), e.g. "web-chat",
  // "telegram", "cron:<job>".
  string channel = 5;

  // Who sent the turn that produced the memory (provenance). Only returned
  // to workspace owners/admins and global admins; empty for other members.
  string principal = 6;

  // Session the memory came from, when known (provenance).
  string session_id = 7;

  google.protobuf.Timestamp created_at = 8;

  google.protobuf.Timestamp updated_at = 9;

  // mem0 relevance score; set on search results only.
  double score = 10;
}

service WorkspaceMemoryService {
  // ListWorkspaceMemories returns the newest memories of one scope, capped
  // at `limit` (mem0 OSS listing has no pagination; search reaches the rest).
  rpc ListWorkspaceMemories(ListWorkspaceMemoriesRequest) returns (ListWorkspaceMemoriesResponse);

  // SearchWorkspaceMemories runs a semantic search in one scope.
  rpc SearchWorkspaceMemories(SearchWorkspaceMemoriesRequest) returns (SearchWorkspaceMemoriesResponse);

  // DeleteWorkspaceMemory deletes one memory of this workspace. A memory
  // that does not exist or belongs to another workspace is NotFound.
  rpc DeleteWorkspaceMemory(DeleteWorkspaceMemoryRequest) returns (DeleteWorkspaceMemoryResponse);
}

message ListWorkspaceMemoriesRequest {
  WorkspaceMemoryScope scope = 1;
  // Required for WORKSPACE_MEMORY_SCOPE_AGENT.
  string agent_id = 2;
}

message ListWorkspaceMemoriesResponse {
  // Newest first.
  repeated WorkspaceMemory memories = 1;
  // True when more memories exist than the listing returns.
  bool truncated = 2;
  // The listing cap applied.
  int32 limit = 3;
}

message SearchWorkspaceMemoriesRequest {
  string query = 1;
  WorkspaceMemoryScope scope = 2;
  // Required for WORKSPACE_MEMORY_SCOPE_AGENT.
  string agent_id = 3;
  // Maximum results; 0 means 20, capped at 100.
  int32 top_k = 4;
}

message SearchWorkspaceMemoriesResponse {
  // Most relevant first.
  repeated WorkspaceMemory memories = 1;
}

message DeleteWorkspaceMemoryRequest {
  string memory_id = 1;
}

message DeleteWorkspaceMemoryResponse {}
