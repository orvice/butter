syntax = "proto3";

package agents.v1;

import "agents/v1/agent.proto";
import "agents/v1/agent_operation.proto";
import "agents/v1/agentchannel.proto";
import "agents/v1/content.proto";
import "agents/v1/dashboard.proto";
import "agents/v1/repobinding.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "go.orx.me/apps/butter/pkg/proto/agents/v1;agentsv1";

// AgentService manages Agent configurations.
service AgentService {
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc GetAgent(GetAgentRequest) returns (GetAgentResponse);
  rpc CreateAgent(CreateAgentRequest) returns (CreateAgentResponse);
  rpc UpdateAgent(UpdateAgentRequest) returns (UpdateAgentResponse);
  rpc DeleteAgent(DeleteAgentRequest) returns (DeleteAgentResponse);
  // InvokeAgent runs an agent once with the given input. If session_id is empty
  // an ephemeral session id is generated; otherwise the existing session is used.
  rpc InvokeAgent(InvokeAgentRequest) returns (InvokeAgentResponse);
  // ListAgentInvocations returns recorded invocations, optionally filtered by
  // agent name, with simple opaque-token pagination.
  rpc ListAgentInvocations(ListAgentInvocationsRequest) returns (ListAgentInvocationsResponse);
  // ReloadAgents drops cached runners and re-resolves agents/MCP/remote-agents
  // from the current configuration. Exposes the runtime hot-reload trigger
  // used internally by config mutations to the dashboard "Hot-reload" button.
  rpc ReloadAgents(ReloadAgentsRequest) returns (ReloadAgentsResponse);
  // GetAgentRuntimeStatus returns the latest invocation state for an agent,
  // suitable for the Agents table Status / Last Run columns.
  rpc GetAgentRuntimeStatus(GetAgentRuntimeStatusRequest) returns (GetAgentRuntimeStatusResponse);
  // ListAgentRuntimeStatuses returns runtime statuses for the given agent
  // names in a single round trip. When `names` is empty, statuses for all
  // configured agents are returned.
  rpc ListAgentRuntimeStatuses(ListAgentRuntimeStatusesRequest) returns (ListAgentRuntimeStatusesResponse);
  // CancelAgentInvocation cancels an in-flight invocation by its ID. The
  // invocation transitions to FAILED with a cancellation error.
  rpc CancelAgentInvocation(CancelAgentInvocationRequest) returns (CancelAgentInvocationResponse);
  // StreamAgent runs an agent and streams progress events back to the
  // caller. The dashboard chat UI uses this Connect server-stream RPC
  // (replaces the removed POST /api/chat/stream SSE endpoint). One of the
  // StreamAgentResponse.event oneof variants is sent for each runner event
  // (started, mid-stream text delta, full ADK event, final response).
  // Errors bubble up as the RPC's terminal connect.Error so the client
  // gets typed cancellation / failed-precondition codes instead of an
  // ad-hoc string payload.
  rpc StreamAgent(StreamAgentRequest) returns (stream StreamAgentResponse);
  // AssignAgentID sets the immutable, workspace-unique slug Agent ID on an
  // existing Agent identified by name. Only workspace owners and
  // administrators may call this; ordinary members receive PermissionDenied.
  // Rejects invalid slugs, reserved values, duplicates, and attempts to
  // reassign an already-set ID.
  rpc AssignAgentID(AssignAgentIDRequest) returns (AssignAgentIDResponse);
  // GetMigrationReadiness reports whether each Agent in the workspace is
  // ready for the identity migration (has a valid Agent ID, all entry-point
  // dependencies resolved, etc.).
  rpc GetMigrationReadiness(GetMigrationReadinessRequest) returns (GetMigrationReadinessResponse);
  // MigrateAgentsV2 expands eligible legacy Agent trees into independent
  // Agent records with ID-based composition. Supports dry-run, apply, and
  // verify modes.
  rpc MigrateAgentsV2(MigrateAgentsV2Request) returns (MigrateAgentsV2Response);

  // UpdateAgentConfiguration is the composite-save command: it coordinates an
  // Agent operational patch (DB-owned) with Agent Content changes (Git-owned)
  // under a single durable operation while keeping ownership separate. The
  // patch is applied with optimistic concurrency (expected_agent_version); a
  // mismatch aborts. Returns the operation record for status/retry.
  rpc UpdateAgentConfiguration(UpdateAgentConfigurationRequest) returns (UpdateAgentConfigurationResponse);

  // RestoreAgent reactivates a soft-deleted (tombstoned) Agent from its
  // retained configuration and Agent Content, flipping it from DELETED back to
  // ACTIVE and re-publishing the retained content.
  rpc RestoreAgent(RestoreAgentRequest) returns (RestoreAgentResponse);

  // GetAgentOperation returns a durable lifecycle operation record by ID.
  rpc GetAgentOperation(GetAgentOperationRequest) returns (GetAgentOperationResponse);

  // ListAgentOperations lists lifecycle operations in the workspace, optionally
  // filtered by status, with opaque-token pagination.
  rpc ListAgentOperations(ListAgentOperationsRequest) returns (ListAgentOperationsResponse);

  // RetryAgentOperation resumes a FAILED lifecycle operation from its first
  // unfinished step. Steps that already succeeded are skipped (idempotent).
  rpc RetryAgentOperation(RetryAgentOperationRequest) returns (RetryAgentOperationResponse);
}

// MCPServerService manages MCP Server configurations.
service MCPServerService {
  rpc ListMCPServers(ListMCPServersRequest) returns (ListMCPServersResponse);
  rpc GetMCPServer(GetMCPServerRequest) returns (GetMCPServerResponse);
  rpc CreateMCPServer(CreateMCPServerRequest) returns (CreateMCPServerResponse);
  rpc UpdateMCPServer(UpdateMCPServerRequest) returns (UpdateMCPServerResponse);
  rpc DeleteMCPServer(DeleteMCPServerRequest) returns (DeleteMCPServerResponse);
  // GetMCPServerStatus returns the current runtime status of a configured
  // MCP server. Implemented in dashboard.proto.
  rpc GetMCPServerStatus(GetMCPServerStatusRequest) returns (GetMCPServerStatusResponse);
  // ListMCPTools enumerates tools exposed by the configured MCP servers.
  // When server_id is empty, all servers are probed.
  rpc ListMCPTools(ListMCPToolsRequest) returns (ListMCPToolsResponse);
  // StartMCPServerOAuth prepares a workspace-scoped OAuth2 authorization
  // flow and returns the user-facing authorization URL.
  rpc StartMCPServerOAuth(StartMCPServerOAuthRequest) returns (StartMCPServerOAuthResponse);
  // CompleteMCPServerOAuth completes an OAuth2 authorization code callback.
  rpc CompleteMCPServerOAuth(CompleteMCPServerOAuthRequest) returns (CompleteMCPServerOAuthResponse);
  // GetMCPServerOAuthStatus returns non-secret OAuth connection state.
  rpc GetMCPServerOAuthStatus(GetMCPServerOAuthStatusRequest) returns (GetMCPServerOAuthStatusResponse);
  // DisconnectMCPServerOAuth removes local OAuth2 credentials for a server.
  rpc DisconnectMCPServerOAuth(DisconnectMCPServerOAuthRequest) returns (DisconnectMCPServerOAuthResponse);
}

// GlobalMCPServerService manages workspace-agnostic MCP server presets that
// admins curate and end users install into their workspace. Browse / install
// is open to authenticated callers; admin role is required for the
// create / update / delete mutations.
service GlobalMCPServerService {
  rpc ListGlobalMCPServers(ListGlobalMCPServersRequest) returns (ListGlobalMCPServersResponse);
  rpc CreateGlobalMCPServer(CreateGlobalMCPServerRequest) returns (CreateGlobalMCPServerResponse);
  rpc UpdateGlobalMCPServer(UpdateGlobalMCPServerRequest) returns (UpdateGlobalMCPServerResponse);
  rpc DeleteGlobalMCPServer(DeleteGlobalMCPServerRequest) returns (DeleteGlobalMCPServerResponse);
  // InstallGlobalMCPServer clones a preset into the caller's workspace.
  // Admins may pass a different target workspace via `workspace_id`; the
  // server audit-logs cross-workspace installs.
  rpc InstallGlobalMCPServer(InstallGlobalMCPServerRequest) returns (InstallGlobalMCPServerResponse);
}

// ModelProviderService manages LLM provider configurations.
service ModelProviderService {
  rpc ListModelProviders(ListModelProvidersRequest) returns (ListModelProvidersResponse);
  rpc GetModelProvider(GetModelProviderRequest) returns (GetModelProviderResponse);
  rpc CreateModelProvider(CreateModelProviderRequest) returns (CreateModelProviderResponse);
  rpc UpdateModelProvider(UpdateModelProviderRequest) returns (UpdateModelProviderResponse);
  rpc DeleteModelProvider(DeleteModelProviderRequest) returns (DeleteModelProviderResponse);
}

// NotifyGroupService manages outbound notification groups.
service NotifyGroupService {
  rpc ListNotifyGroups(ListNotifyGroupsRequest) returns (ListNotifyGroupsResponse);
  rpc GetNotifyGroup(GetNotifyGroupRequest) returns (GetNotifyGroupResponse);
  rpc CreateNotifyGroup(CreateNotifyGroupRequest) returns (CreateNotifyGroupResponse);
  rpc UpdateNotifyGroup(UpdateNotifyGroupRequest) returns (UpdateNotifyGroupResponse);
  rpc DeleteNotifyGroup(DeleteNotifyGroupRequest) returns (DeleteNotifyGroupResponse);
}

// RemoteAgentService manages Remote Agent configurations.
service RemoteAgentService {
  rpc ListRemoteAgents(ListRemoteAgentsRequest) returns (ListRemoteAgentsResponse);
  rpc GetRemoteAgent(GetRemoteAgentRequest) returns (GetRemoteAgentResponse);
  rpc CreateRemoteAgent(CreateRemoteAgentRequest) returns (CreateRemoteAgentResponse);
  rpc UpdateRemoteAgent(UpdateRemoteAgentRequest) returns (UpdateRemoteAgentResponse);
  rpc DeleteRemoteAgent(DeleteRemoteAgentRequest) returns (DeleteRemoteAgentResponse);
  // GetRemoteAgentStatus probes the configured remote agent endpoint and
  // returns its liveness state (A2A: HTTP agent.json; daemon: registry).
  rpc GetRemoteAgentStatus(GetRemoteAgentStatusRequest) returns (GetRemoteAgentStatusResponse);
}

// --- Agent messages ---

message ListAgentsRequest {
  // Maximum records per page. Defaults to 50.
  int32 page_size = 1;
  // Pagination token from a previous response.
  string page_token = 2;
}

message ListAgentsResponse {
  repeated Agent agents = 1;
  // Token for the next page; empty if there are no more results.
  string next_page_token = 2;
  // Total agents across all pages.
  int32 total = 3;
}

message ReloadAgentsRequest {}

message ReloadAgentsResponse {
  google.protobuf.Timestamp reloaded_at = 1;
}

// AgentRuntimeState classifies the agent's most recent runtime state, derived
// from the latest invocation.
enum AgentRuntimeState {
  AGENT_RUNTIME_STATE_UNSPECIFIED = 0;
  AGENT_RUNTIME_STATE_IDLE = 1;
  AGENT_RUNTIME_STATE_RUNNING = 2;
  AGENT_RUNTIME_STATE_FAILED = 3;
}

message AgentRuntimeStatus {
  string name = 1;
  AgentRuntimeState state = 2;
  google.protobuf.Timestamp last_run_at = 3;
  // ID of the latest invocation, if any.
  string last_invocation_id = 4;
  // Number of in-flight (RUNNING) invocations for this agent.
  int32 in_flight = 5;
  // Immutable agent_id of the agent, when assigned.
  string agent_id = 6;
}

message GetAgentRuntimeStatusRequest {
  // Legacy name lookup. Deprecated: use agent_id.
  string name = 1;
  // Immutable agent_id of the agent. Preferred over name.
  string agent_id = 2;
}

message GetAgentRuntimeStatusResponse {
  AgentRuntimeStatus status = 1;
}

message ListAgentRuntimeStatusesRequest {
  // Legacy name filter. Deprecated: use agent_ids.
  repeated string names = 1;
  // Filter by immutable agent_ids. Preferred over names.
  repeated string agent_ids = 2;
}

message ListAgentRuntimeStatusesResponse {
  repeated AgentRuntimeStatus statuses = 1;
}

message CancelAgentInvocationRequest {
  string invocation_id = 1;
}

message CancelAgentInvocationResponse {
  // True if the invocation was found and the cancel signal was delivered.
  bool cancelled = 1;
}

// --- StreamAgent messages ---

message StreamAgentRequest {
  // Legacy agent name. Deprecated: use agent_id.
  string agent_name = 1;
  // User prompt to send to the agent. Required, non-empty.
  string message = 2;
  // ADK app name. Defaults to "api" when empty.
  string app_name = 3;
  // ADK user id. Defaults to "api" when empty.
  string user_id = 4;
  // Existing session id, or empty to start an ephemeral session.
  string session_id = 5;
  // Optional model override; if set the agent runs with this model
  // instead of the configured default.
  string model_override = 6;
  // Multimodal input parts (text and inline images). When non-empty,
  // `parts` is used as the user input and `message` is ignored. When
  // empty, `message` is used as before. Validation (MIME whitelist,
  // size and count limits) happens in the application layer.
  repeated InputPart parts = 7;
  // Immutable agent_id of the agent to invoke. Preferred over agent_name.
  string agent_id = 8;
}

// StreamAgentResponse is sent for every observable transition during
// the agent invocation. The oneof guarantees clients see exactly one
// variant per message — no ad-hoc JSON payload disambiguation.
message StreamAgentResponse {
  oneof event {
    StreamAgentStarted started = 1;
    StreamAgentRunEvent run_event = 2;
    StreamAgentTextDelta text_delta = 3;
    StreamAgentFinal final = 4;
  }
}

// StreamAgentStarted is the first event in the stream; it carries the
// server-assigned invocation_id so callers can correlate with
// CancelAgentInvocation.
message StreamAgentStarted {
  string invocation_id = 1;
  string session_id = 2;
  string agent_name = 3;
  // Immutable agent_id of the resolved agent, when assigned.
  string agent_id = 4;
}

// StreamAgentRunEvent mirrors a single ADK session.Event. content_json
// is the genai.Content payload serialized as JSON; the dashboard parses
// it client-side to render tool calls / function responses / etc.
message StreamAgentRunEvent {
  string invocation_id = 1;
  string session_id = 2;
  string agent_name = 3;
  string event_id = 4;
  string author = 5;
  string branch = 6;
  bool partial = 7;
  bool final_response = 8;
  string content_json = 9;
  google.protobuf.Timestamp timestamp = 10;
  // Immutable agent_id of the resolved agent, when assigned.
  string agent_id = 11;
}

// StreamAgentTextDelta is emitted for partial assistant-text chunks so
// the UI can render the response as it streams in.
message StreamAgentTextDelta {
  string invocation_id = 1;
  string session_id = 2;
  string agent_name = 3;
  string text = 4;
  // Immutable agent_id of the resolved agent, when assigned.
  string agent_id = 5;
}

// StreamAgentFinal is sent once after the runner returns the final
// response text. The stream is closed by the server after this.
message StreamAgentFinal {
  string invocation_id = 1;
  string session_id = 2;
  string agent_name = 3;
  string response = 4;
  // Immutable agent_id of the resolved agent, when assigned.
  string agent_id = 5;
}

message GetAgentRequest {
  string name = 1;
  // Optional: look up by immutable agent_id instead of name.
  // When set, name is ignored.
  string agent_id = 2;
}

message GetAgentResponse {
  Agent agent = 1;
}

message CreateAgentRequest {
  Agent agent = 1;

  // Initial Agent Content for a Git-bound workspace. When the workspace has a
  // repository binding and this is set, the agent is created through the create
  // Saga: the DB row starts in PROVISIONING, the content is committed and
  // published, and the agent activates only after publication succeeds. For an
  // LLM agent, prompt must be non-empty. Ignored for unbound workspaces (which
  // keep content in the DB and activate immediately).
  AgentContentInput initial_content = 2;

  // Optional caller-supplied operation ID for idempotent retries of the create
  // Saga. When empty the server generates one.
  string operation_id = 3;
}

message CreateAgentResponse {
  Agent agent = 1;

  // The lifecycle operation record, set when the create ran as a Saga (bound
  // workspace). Nil for the immediate single-step path (unbound workspace).
  AgentOperation operation = 2;
}

// AgentContentInput carries the reserved Markdown files for an agent, mapped to
// agents/{agent-id}/{description.md, prompt.md, global-prompt.md}.
message AgentContentInput {
  string description = 1;
  string prompt = 2;
  string global_prompt = 3;
}

// UpdateAgentConfigurationRequest is the composite-save command. The agent
// patch and the content changes retain separate ownership (DB vs Git); the
// operation coordinates them but does not claim a distributed transaction.
message UpdateAgentConfigurationRequest {
  // The full operational config to write (DB-owned). Identity fields
  // (agent_id, lifecycle_status, legacy_name) are server-enforced.
  Agent agent_patch = 1;

  // Git content changes to apply as a single commit before the DB patch.
  repeated ContentFileAction content_changes = 2;

  // The agent version the caller observed. A mismatch aborts with Aborted.
  int64 expected_agent_version = 3;

  // The cached base revision SHA (informational; last-write-wins applies).
  string base_commit_sha = 4;

  // Optional caller-supplied operation ID for idempotent retries.
  string operation_id = 5;
}

message UpdateAgentConfigurationResponse {
  Agent agent = 1;
  AgentOperation operation = 2;
  // Per-agent content validation errors that blocked the commit (empty on success).
  repeated string validation_errors = 3;
}

message RestoreAgentRequest {
  string agent_id = 1;
  // Optional caller-supplied operation ID for idempotent retries.
  string operation_id = 2;
}

message RestoreAgentResponse {
  Agent agent = 1;
  AgentOperation operation = 2;
  repeated string validation_errors = 3;
}

message GetAgentOperationRequest {
  string operation_id = 1;
}

message GetAgentOperationResponse {
  AgentOperation operation = 1;
}

message ListAgentOperationsRequest {
  // Optional status filter; UNSPECIFIED returns all.
  AgentOperationStatus status = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListAgentOperationsResponse {
  repeated AgentOperation operations = 1;
  string next_page_token = 2;
}

message RetryAgentOperationRequest {
  string operation_id = 1;
}

message RetryAgentOperationResponse {
  Agent agent = 1;
  AgentOperation operation = 2;
  repeated string validation_errors = 3;
}

message UpdateAgentRequest {
  Agent agent = 1;
}

message UpdateAgentResponse {
  Agent agent = 1;
}

message DeleteAgentRequest {
  string name = 1;
  // Optional: identify by immutable agent_id instead of name.
  // When set, name is ignored.
  string agent_id = 2;
}

message DeleteAgentResponse {}

// --- AssignAgentID messages ---

message AssignAgentIDRequest {
  // Name of the existing agent (the current lookup key).
  string name = 1;
  // The slug to assign as the Agent ID.
  string agent_id = 2;
}

message AssignAgentIDResponse {
  Agent agent = 1;
}

// --- Migration readiness messages ---

message GetMigrationReadinessRequest {}

message GetMigrationReadinessResponse {
  repeated AgentMigrationStatus statuses = 1;
}

// MigrationReadiness classifies an agent's readiness for the identity
// migration.
enum MigrationReadiness {
  MIGRATION_READINESS_UNSPECIFIED = 0;
  // The agent has a valid Agent ID and all dependencies are resolved.
  MIGRATION_READINESS_READY = 1;
  // The agent has not been assigned an Agent ID.
  MIGRATION_READINESS_MISSING_ID = 2;
  // The agent's Agent ID conflicts with another agent in the workspace.
  MIGRATION_READINESS_CONFLICT = 3;
  // The agent references sub-agents or workflow nodes whose targets
  // have not been assigned an Agent ID.
  MIGRATION_READINESS_INCOMPLETE_DEPS = 4;
}

message AgentMigrationStatus {
  string name = 1;
  string agent_id = 2;
  MigrationReadiness readiness = 3;
  // Human-readable detail when readiness is not READY.
  string detail = 4;
}

// --- MigrateAgentsV2 messages ---

enum MigrateMode {
  MIGRATE_MODE_UNSPECIFIED = 0;
  // Report what would be migrated without making changes.
  MIGRATE_MODE_DRY_RUN = 1;
  // Expand eligible legacy trees into independent Agent records.
  MIGRATE_MODE_APPLY = 2;
  // Verify that all agents are fully migrated.
  MIGRATE_MODE_VERIFY = 3;
}

message MigrateAgentsV2Request {
  MigrateMode mode = 1;
}

// MigrateAgentResult describes what happened (or would happen) for one agent.
message MigrateAgentResult {
  string name = 1;
  string agent_id = 2;
  // Action taken: "expanded", "skipped", "already_independent",
  // "missing_id", "error", "ok", or "migration_required".
  string action = 3;
  string detail = 4;
}

message MigrateAgentsV2Response {
  MigrateMode mode = 1;
  repeated MigrateAgentResult results = 2;
  // Summary counts.
  int32 total = 3;
  int32 migrated = 4;
  int32 skipped = 5;
  int32 errors = 6;
}

message InvokeAgentRequest {
  // Legacy agent name. Deprecated: use agent_id.
  string agent_name = 1;
  // Input message text (required).
  string input = 2;
  // App / channel name for the invocation context. Defaults to "api" if empty.
  string app_name = 3;
  // User id for the invocation context. Defaults to "api" if empty.
  string user_id = 4;
  // Existing session id. Empty triggers a new ephemeral session id.
  string session_id = 5;
  // Optional model override alias or full name.
  string model_override = 6;
  // Immutable agent_id of the agent to invoke. Preferred over agent_name.
  string agent_id = 7;
}

message InvokeAgentResponse {
  // Session id used (echoed back, may have been auto-generated).
  string session_id = 1;
  // Final agent response text.
  string response = 2;
}

// InvocationStatus tracks the lifecycle of an agent invocation.
enum InvocationStatus {
  INVOCATION_STATUS_UNSPECIFIED = 0;
  INVOCATION_STATUS_RUNNING = 1;
  INVOCATION_STATUS_SUCCEEDED = 2;
  INVOCATION_STATUS_FAILED = 3;
}

// Invocation is a persisted record of a single Runner.Run call.
message Invocation {
  // @gotags: bson:"_id,omitempty"
  string id = 1;
  // @gotags: bson:"agent_name,omitempty"
  string agent_name = 2;
  // @gotags: bson:"app_name,omitempty"
  string app_name = 3;
  // @gotags: bson:"user_id,omitempty"
  string user_id = 4;
  // @gotags: bson:"session_id,omitempty"
  string session_id = 5;
  // @gotags: bson:"status,omitempty"
  InvocationStatus status = 6;
  // @gotags: bson:"input,omitempty"
  string input = 7;
  // @gotags: bson:"output,omitempty"
  string output = 8;
  // @gotags: bson:"error,omitempty"
  string error = 9;
  // @gotags: bson:"started_at,omitempty"
  google.protobuf.Timestamp started_at = 10;
  // @gotags: bson:"finished_at,omitempty"
  google.protobuf.Timestamp finished_at = 11;
  // @gotags: bson:"latency_ms,omitempty"
  int64 latency_ms = 12;
  // @gotags: bson:"model_override,omitempty"
  string model_override = 13;
  // @gotags: bson:"source,omitempty"
  string source = 14;
  // Immutable agent_id of the invoked agent. Empty on historical records
  // written before the Agent ID migration.
  // @gotags: bson:"agent_id,omitempty"
  string agent_id = 15;
  // Display-name snapshot taken at invocation time so historical rows stay
  // readable after renames.
  // @gotags: bson:"agent_display_name,omitempty"
  string agent_display_name = 16;
  // @gotags: bson:"workspace_id,omitempty"
  string workspace_id = 100;
}

message ListAgentInvocationsRequest {
  // Legacy: filter by agent name. Deprecated: use agent_id.
  string agent_name = 1;
  // Optional: filter by session id.
  string session_id = 2;
  // Maximum records per page. Defaults to 20.
  int32 page_size = 3;
  // Pagination token from a previous response.
  string page_token = 4;
  // Optional: filter by immutable agent_id. Preferred over agent_name.
  string agent_id = 5;
}

message ListAgentInvocationsResponse {
  repeated Invocation invocations = 1;
  string next_page_token = 2;
  int32 total = 3;
}

