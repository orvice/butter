version: v2
plugins:
  - local: [dart, run, protoc_plugin]
    out: lib/gen
    include_imports: true
    include_wkt: true
  - local: [dart, run, connectrpc:protoc-gen-connect-dart]
    out: lib/gen
    include_imports: true
inputs:
  - directory: ..
    paths:
      - ../proto/agents/v1/auth.proto
      - ../proto/agents/v1/workspace.proto
      - ../proto/agents/v1/agent_service.proto
      - ../proto/agents/v1/skill.proto
      - ../proto/agents/v1/butterbox.proto
      - ../proto/agents/v1/githost.proto
      - ../proto/agents/v1/repobinding.proto
      - ../proto/agents/v1/agent_file.proto
      - ../proto/agents/v1/cron.proto
      - ../proto/agents/v1/telegram.proto
      - ../proto/agents/v1/workspace_memory.proto
      - ../proto/agents/v1/automation.proto
      - ../proto/agents/v1/linear.proto
